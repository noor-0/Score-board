<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="main-div">
        <div class="score-board">
            <h1 class="team-name">HOME</h1>
            <div class="score-box">
                <h1 id="score1">00</h1>
            </div>
            <div class="btn-div">
                <button class="btn" onclick="increment(1, 1)">+1</button>
                <button class="btn" onclick="increment(2, 1)">+2</button>
                <button class="btn" onclick="increment(3, 1)">+3</button>
            </div>
        </div>

        <button id="reset-btn" onclick="reset()">New Game</button>

        <div class="score-board">
            <h1 class="team-name">GUEST</h1>
            <div class="score-box">
                <h1 id="score2">00</h1>
            </div>
            <div class="btn-div">
                <button class="btn" onclick="increment(1,2)">+1</button>
                <button class="btn" onclick="increment(2,2)">+2</button>
                <button class="btn" onclick="increment(3,2)">+3</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
